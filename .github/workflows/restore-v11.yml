name: Restore revised v1.1 page

on:
  push:
    paths:
      - ".github/workflows/restore-v11.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "v11-restore"
  cancel-in-progress: false

jobs:
  restore-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore normal HTML index
        run: |
          cat page-source/b64-1.txt page-source/b64-2a.txt page-source/b64-2b.txt page-source/b64-2c.txt page-source/b64-2d.txt page-source/b64-3.txt page-source/b64-4.txt | base64 -d > /tmp/v11.html.gz
          echo "c69452ac9723e0d3d298b8cc1b3d312b20f8ff50b273a847b6fae1c294c1710f  /tmp/v11.html.gz" | sha256sum -c -
          gzip -dc /tmp/v11.html.gz > index.html
          echo "e004a71abed3800620c54c0bcd5013c8fea278004a39caf9b1fb96c5a68b3521  index.html" | sha256sum -c -
          grep -q "Version 1.1" index.html
          grep -q 'id="ai"' index.html

      - name: Commit revised v1.1 index
        run: |
          git config user.name "Anir-a"
          git config user.email "actions@github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Restore v1.1 with targeted feedback fixes"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
